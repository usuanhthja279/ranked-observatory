<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up · Valorant Ranked Observatory</title><link rel="stylesheet" href="/account.css"></head><body><main><a href="/leaderboard.html" class="brand"><span class="brand-mark" aria-hidden="true">V</span>Valorant Ranked Observatory</a><section class="panel"><h1>Create your account</h1><p class="muted">Join Valorant Ranked Observatory.</p><p id="accountMessage" class="message" role="status"></p><form id="signupForm"><label>Name<input name="name" autocomplete="name" maxlength="120" required></label><label>Username<input name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,30}" minlength="3" maxlength="30" required></label><p class="note">3–30 letters, numbers or underscores.</p><label>Email<input type="email" name="email" autocomplete="email" maxlength="320" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required></label><button id="accountSubmit" disabled>Create account</button></form><p class="switch">Already have an account? <a href="/signin.html">Sign in</a></p></section></main><script src="/account.js"></script></body></html>
