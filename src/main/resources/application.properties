spring.application.name=valorant-leaderboard-service
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript,text/javascript,image/svg+xml
server.port=${LEADERBOARD_PORT:8090}
server.address=${LEADERBOARD_BIND_ADDRESS:127.0.0.1}
server.servlet.session.cookie.name=LEADERBOARD_SESSION

# Separate database, credentials and migration history from the stream tracker.
spring.datasource.url=${LEADERBOARD_DB_URL:jdbc:postgresql://localhost:5433/valorant_leaderboard}
spring.datasource.username=${LEADERBOARD_DB_USERNAME:leaderboard}
spring.datasource.password=${LEADERBOARD_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.schema=leaderboard
spring.flyway.enabled=true
spring.flyway.default-schema=leaderboard
spring.flyway.schemas=leaderboard
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

# This service has its own login; no tracker user database or OAuth required.
spring.security.user.name=${LEADERBOARD_ADMIN_USER:admin}
spring.security.user.password=${LEADERBOARD_ADMIN_PASSWORD:${random.uuid}}

leaderboard.enabled=${LEADERBOARD_ENABLED:true}
leaderboard.pause-all-extraction=${LEADERBOARD_PAUSE_ALL_EXTRACTION:false}
leaderboard.pause-archive-extraction=${LEADERBOARD_PAUSE_ARCHIVE_EXTRACTION:${LEADERBOARD_PAUSE_ALL_EXTRACTION:false}}
leaderboard.act=${LEADERBOARD_ACT:d816f426-48ea-f052-117f-9697a155b319}
# Start at application readiness, then repeat every 20 minutes.
leaderboard.collection-interval-ms=${LEADERBOARD_COLLECTION_INTERVAL_MS:1200000}
leaderboard.max-pages=${LEADERBOARD_MAX_PAGES:200}
leaderboard.request-delay-ms=${LEADERBOARD_REQUEST_DELAY_MS:1000}
leaderboard.global.max-pages=${LEADERBOARD_GLOBAL_MAX_PAGES:2000}
leaderboard.global.request-delay-ms=${LEADERBOARD_GLOBAL_REQUEST_DELAY_MS:500}
leaderboard.global.regional-fallback=${LEADERBOARD_REGIONAL_FALLBACK:true}
leaderboard.bootstrap-directory=${LEADERBOARD_BOOTSTRAP_DIRECTORY:}

# Worker count is independent of the shared request start-rate limit (minimum 500 ms).
leaderboard.global.concurrency=${LEADERBOARD_GLOBAL_CONCURRENCY:5}
leaderboard.tracker.source-transport=${LEADERBOARD_SOURCE_TRANSPORT:direct}
leaderboard.tracker.flaresolverr-url=${LEADERBOARD_FLARESOLVERR_URL:http://127.0.0.1:8191}

leaderboard.live-cache-directory=${LEADERBOARD_LIVE_CACHE_DIRECTORY:build/live-collection}
leaderboard.resume-capture=${LEADERBOARD_RESUME_CAPTURE:}

leaderboard.schedule-zone=${LEADERBOARD_SCHEDULE_ZONE:Asia/Kolkata}

# Honor HTTPS forwarded by the loopback Cloudflare tunnel. Origin remains loopback-only.
server.forward-headers-strategy=native

