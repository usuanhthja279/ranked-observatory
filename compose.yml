services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: valorant_leaderboard
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: ${LEADERBOARD_DB_PASSWORD:?Set LEADERBOARD_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - leaderboard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d valorant_leaderboard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  leaderboard_data:
