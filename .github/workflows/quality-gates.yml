name: Observatory quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: observatory-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ranked_observatory_redesign_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ranked_observatory_redesign_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LEADERBOARD_TEST_DB_URL: jdbc:postgresql://localhost:5432/ranked_observatory_redesign_test
      LEADERBOARD_TEST_DB_USERNAME: postgres
      LEADERBOARD_TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Java and PostgreSQL integration tests
        run: ./gradlew test
      - name: Run JavaScript tests
        run: node --test src/test/js/*.test.cjs
      - name: Validate browser JavaScript syntax
        run: find src/main/resources/static -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install pinned browser smoke dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start an empty-database app with collection disabled
        run: |
          mkdir -p build
          LEADERBOARD_PORT=8090 \
          LEADERBOARD_BIND_ADDRESS=0.0.0.0 \
          LEADERBOARD_DB_URL="$LEADERBOARD_TEST_DB_URL" \
          LEADERBOARD_DB_USERNAME="$LEADERBOARD_TEST_DB_USERNAME" \
          LEADERBOARD_DB_PASSWORD="$LEADERBOARD_TEST_DB_PASSWORD" \
          LEADERBOARD_ENABLED=false \
          LEADERBOARD_PAUSE_ALL_EXTRACTION=true \
          ./gradlew bootRun > build/browser-smoke-app.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8090/overview >/dev/null; then exit 0; fi
            sleep 2
          done
          cat build/browser-smoke-app.log
          exit 1
      - name: Run isolated browser smoke and responsive checks
        run: node scripts/leaderboard/browser-smoke.cjs
      - name: Upload smoke screenshots and app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-browser-smoke
          path: |
            build/browser-smoke/
            build/browser-smoke-app.log
          if-no-files-found: ignore
