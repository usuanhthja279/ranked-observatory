function btn(label,action,cl='ghost',attrs=''){return `<button class="btn ${cl}" data-action="${esc(action)}" ${attrs}>${label}</button>`}

function chart(series,labels,{min=0,max=null,style='standard',height=255,legend=true,cutoff=null}={}){const W=780,H=height,left=54,right=18,top=16,bottom=38;const all=series.flatMap(s=>s.values.filter(v=>v!=null));const maxValue=max??Math.max(10,...all)*1.12;const low=min;const X=i=>left+i*(W-left-right)/Math.max(1,labels.length-1);const Y=v=>top+(H-top-bottom)*(1-(v-low)/Math.max(1,maxValue-low));let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Illustrative line chart, corresponding values available in table">`;
for(let i=0;i<5;i++){let val=low+(maxValue-low)*(4-i)/4,y=Y(val);out+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#385169" stroke-dasharray="3 6"/><text x="${left-11}" y="${y+4}" text-anchor="end" fill="#8ea9c0" font-size="11">${Math.round(val).toLocaleString()}</text>`}labels.forEach((l,i)=>{if(i===0||i===labels.length-1||labels.length<7||i%2===0)out+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" fill="#91aabd" font-size="11">${esc(l)}</text>`});if(cutoff!==null){const y=Y(cutoff);out+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#eac887" stroke-width="1.9" stroke-dasharray="6 6"/>`}
series.forEach((s,idx)=>{let color=s.color||COLORS[idx%COLORS.length],segments=[],current=[];s.values.forEach((v,i)=>{if(v==null){if(current.length)segments.push(current);current=[]}else current.push([X(i),Y(v),v,i])});if(current.length)segments.push(current);for(let seg of segments){let d='M'+seg[0][0]+' '+seg[0][1];for(let k=1;k<seg.length;k++){const p=seg[k-1],q=seg[k];if(style==='step')d+=` H${q[0]} V${q[1]}`;else if(style==='smooth'){let dx=(q[0]-p[0])*.38;d+=` C${p[0]+dx} ${p[1]} ${q[0]-dx} ${q[1]} ${q[0]} ${q[1]}`}else d+=` L${q[0]} ${q[1]}`}out+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>`;for(let point of seg)out+=`<circle cx="${point[0]}" cy="${point[1]}" r="3.6" fill="${color}" stroke="#0d1f32" stroke-width="1.5"><title>${esc(s.name)} · ${esc(labels[point[3]])}: ${point[2]}</title></circle>`}});out+='</svg>';if(legend)out+=`<div class="legend">${series.map((s,i)=>`<span><i style="background:${s.color||COLORS[i%COLORS.length]}"></i>${esc(s.name)}</span>`).join('')}${cutoff!==null?'<span><i style="background:#eac887"></i>Observed cutoff (illustrative)</span>':''}</div>`;return `<div class="chart-wrap">${out}</div>`}
function barChart(items,{label='Observed players'}={}){const mx=Math.max(1,...items.map(i=>i.val));return `<div class="stack" style="gap:13px">${items.map((x,i)=>`<div class="row" style="gap:10px"><div style="width:108px;flex:none;font-size:12px;color:#c7dce9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.label)}</div><div class="fill progress" style="height:10px"><span style="width:${100*x.val/mx}%;background:${COLORS[i%COLORS.length]}"></span></div><strong style="min-width:42px;text-align:right;font-size:12px">${n(x.val)}</strong></div>`).join('')}<div class="tiny">${esc(label)} · sample data</div></div>`}

<div class="grid g2">${panel('Regional ladder coverage',chart(rdata.map((r,i)=>({...r,color:COLORS[i]})),['10 am','11 am','12 pm','1 pm','2 pm','Now'],{min:0,height:235})+'<p class="inline-note">Illustrative series. A higher collected player count does not by itself imply population growth.</p>',tag('OBSERVED',''))}${panel('Leading represented countries',barChart(COUNTRIES.slice(0,6).map(c=>({label:c.name,val:c.players})))+'<div style="margin-top:12px">'+a('Browse all countries →','countries','ghost sm')+'</div>')}</div>
${panel('Featured investigation · Radiant race',`<div class="row wrap between"><div class="row"><div class="person-portrait" style="width:60px;height:60px;font-size:31px">◈</div><div><h3>S8UL SkRossi <span class="muted small">#4646</span></h3><p class="small">🇮🇳 India · APAC · Observed Radiant</p></div></div><div>${tag('1 RR above sample boundary','gold')}</div></div><div style="height:14px"></div><div class="g3 grid">${metric('480 RR','Player RR','Last illustrative sample','gold')}${metric('479 RR','Observed boundary','Not an official requirement')}${metric('+1 RR','Relative position','Snapshot comparison','blue')}</div><div style="margin-top:14px">${a('Open player journey and RR chart →','player','primary')}</div>`)}`}

function countries(){let list=COUNTRIES.filter(c=>c.name.toLowerCase().includes(state.countrySearch.toLowerCase()));return `${head('Countries','Explore observed ranked representation by country, tier, region and Act.',a('Compare two countries →','compare','primary'),'COUNTRY EXPLORER')}${panel('Find a country',`<div class="field-row"><div class="field long"><label for="countryInput">Country search</label><input id="countryInput" class="input" placeholder="Search country..." value="${esc(state.countrySearch)}" data-input="country-search"></div><div class="field"><label>Coverage</label><select class="select"><option>All observed countries</option></select></div></div><div style="margin-top:14px" id="countryResults">${tbl(['Country',{t:'Players',right:true},{t:'Radiants',right:true},{t:'Immortal 3',right:true},{t:'Coverage',right:true},{t:'Δ',right:true}],countryRows(list,{coverage:true}))}</div>`)}${panel('Understand what a country count means',`<div class="callout teal"><span>ⓘ</span><p>Country means the source-provided country label of an observed ranked leaderboard entry. It is not a census of national players. Estimated unknown-country allocation should always be opt-in and explicitly labeled.</p></div>`)}`}

function leaderboard(){const regs=[['all','All regions'],...REGIONS.map(r=>[r.id,r.name])];return `${head('Global leaderboard','Search and explore ranked player entries, their regions, RR changes and observed rank.',a('Open player profile →','player','primary'),'PLAYER DISCOVERY')}${panel('Search & filter the ladder',`<div class="field-row"><div class="field long" style="flex:2"><label for="globalPlayerSearch">Find player or Riot ID</label><input class="input" id="globalPlayerSearch" data-input="leaderboard-search" value="${esc(state.globalSearch)}" placeholder="Try SkRossi or #4646"></div><div class="field"><label for="globalRegion">Region</label><select class="select" id="globalRegion" data-input="leaderboard-region">${regs.map(([id,label])=>`<option value="${id}" ${id===state.globalRegion?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label for="globalTier">Tier</label><select class="select" id="globalTier" data-input="leaderboard-tier">${['all','Radiant','Immortal 3','Immortal 2','Immortal 1'].map(t=>`<option value="${t}" ${t===state.globalTier?'selected':''}>${t==='all'?'All tiers':t}</option>`).join('')}</select></div><div class="field"><label for="globalSort">Sort</label><select class="select" id="globalSort" data-input="leaderboard-sort"><option value="rank" ${state.globalSort==='rank'?'selected':''}>Rank ascending</option><option value="rr" ${state.globalSort==='rr'?'selected':''}>RR descending</option><option value="change" ${state.globalSort==='change'?'selected':''}>RR movement</option></select></div></div>`)}<div id="leaderboardResults">${renderLeaderboardResults()}</div><div class="callout teal"><span>◈</span><div><strong>Ranking information and source provenance</strong><p>Rows represent illustrative recorded leaderboard entries, not all regional competitors. A global ordering and regional ordering may rely on different source snapshots.</p></div></div>`}

function player(){let p=playerById(state.player),r=regionById(p.region),boundary=r.cutoff,above=p.rr-boundary;const labels=['10:00','10:20','10:40','11:00','11:20','11:40','12:00','12:20'];const top=Math.max(p.rr+25,boundary+25);let rel=above>0?`${above} RR above`:above<0?`${-above} RR below`:'At boundary';let actSeries=[{name:'Player RR',values:p.history,color:COLORS[0]},{name:'Boundary',values:[boundary-5,boundary-5,boundary-3,boundary-3,boundary-2,boundary-1,boundary,boundary],color:COLORS[2]}];return `${head(`${p.name} <span class="muted">${p.tag}</span>`,`${p.flag} ${p.country} · ${r.name} · Last observed ${p.seen} ago`,`${saveButton('player',p.id)} ${a('Compare ↗','compare','ghost')}`,'PLAYER INTELLIGENCE')}<section class="panel"><div class="row between wrap"><div class="person-head"><div class="person-portrait">◈</div><div><div class="overline">CURRENT OBSERVED TIER</div><h1 style="margin-top:5px">${p.tier}</h1><p class="small">Global rank #${p.rank} · ${p.rr} RR</p></div></div><div class="badge gold">✦ Radiant race context</div></div></section><div class="grid g4">${metric(n(p.rr),'Observed RR','Last recorded player value','gold')}${metric('#'+p.rank,'Demo global position','Not synchronized region rank')}${metric(rel,'Vs. observed boundary','Not official promotion criteria','pink')}${metric((p.delta>=0?'+':'')+p.delta,'Recent observed RR change','Illustrative snapshots','blue')}</div><div class="grid g2">${panel('RR history vs. observed regional cutoff',chart(actSeries,labels,{min:Math.max(0,Math.min(...p.history.filter(x=>x!=null),boundary)-30),max:top,height:260})+'<div class="callout" style="margin-top:13px"><span>ⓘ</span><p>Observed snapshots are not a match timeline. No connection is drawn where a sample is missing. Region cutoff is observational only.</p></div>',tag('SOURCE-AWARE',''))}${panel('Radiant race and next targets',`<div class="quality-grid"><div><strong>${boundary} RR</strong><span>Observed ${r.short} boundary</span></div><div><strong>${rel}</strong><span>Player relative position</span></div><div><strong>${p.seen}</strong><span>Player sample freshness</span></div></div><div class="divider" style="margin:17px 0"></div><h3 style="margin-bottom:12px">Nearby ranking targets</h3><div class="compact-list">${PLAYERS.filter(x=>x.id!==p.id&&x.region===p.region).slice(0,4).map(x=>`<div class="item-row"><div class="main-row">${playerLink(x)}</div><span class="small muted">${x.rr} RR</span><span class="badge gray">${x.rr>p.rr?'+'+(x.rr-p.rr):x.rr-p.rr}</span></div>`).join('')||'<div class="empty">No comparable targets in the demo subset.</div>'}</div>` )}</div>${panel('Rank journey · multiple Acts',`<div class="calendar">${['E8 Act I','E8 Act II','E8 Act III','E9 Act I','Current'].map((x,i)=>`<div class="act-step"><strong>${['Immortal 1','Immortal 2','Immortal 3','Radiant',p.tier][i]}</strong><span>${x}</span></div>`).join('')}</div><p class="inline-note" style="margin-top:14px">Illustrative reconstructed journey. An absent snapshot means unknown, not necessarily a demotion.</p>`,tag('NEW · DEDICATED PROFILE','gold'))}${panel('Observation evidence & provenance',`<div class="grid g3"><div><div class="kpi-label">Latest observation</div><h3>${p.seen} ago</h3><p class="small">Player-scoped sample record</p></div><div><div class="kpi-label">Tier basis</div><h3>Recorded</h3><p class="small">Do not mix with reconstructed tiers</p></div><div><div class="kpi-label">Source alignment</div><h3>Not synchronized</h3><p class="small">Cutoff and player may differ in capture time</p></div></div>`,a('Review methodology ↗','methodology','ghost sm'))}`}
function trendValues(country){let vals=TRENDS[country]||TRENDS.India;let m=state.trendTier==='Radiant'?0.14:state.trendTier==='Immortal 2'?0.48:state.trendTier==='All ranked'?1:0.31;return vals.map(v=>v===null?null:Math.round(v*m*(state.trendEstimate?1.12:1))).slice(state.trendFrom,state.trendTo+1)}
function trends(){const set=state.trendSelected.filter(c=>TRENDS[c]);const subset=ACTS.slice(state.trendFrom,state.trendTo+1);let series=set.map((c,i)=>({name:c,values:trendValues(c),color:COLORS[i%COLORS.length]}));let rows=set.map(c=>{let vals=trendValues(c),valid=vals.filter(x=>x!==null),start=vals[0],end=vals[vals.length-1],change=(start!==null&&end!==null)?end-start:null,changePct=change!==null&&start!==0?((change/start)*100).toFixed(1)+'%':'N/A';return `<tr><td>${esc(c)}</td><td class="num">${start===null?'—':n(start)}</td><td class="num">${end===null?'—':n(end)}</td><td class="num ${change===null?'':change>=0?'pos':'neg'}">${change===null?'N/A':(change>0?'+':'')+change}</td><td class="num">${changePct}</td><td class="num">${valid.length?Math.max(...valid):'—'}</td><td class="num">${valid.length}/${subset.length}</td></tr>`});const switches=['standard','smooth','step'].map(m=>`<button class="${state.trendMode===m?'active':''}" data-action="trend-mode" data-mode="${m}">${m==='standard'?'Standard':m==='smooth'?'Smooth':'Stepped'}</button>`).join('');return `${head('Act trends analytics','Compare Immortal/Radiant representation through historical Acts with visible evidence gaps.',a('Read data methodology ↗','methodology','ghost'),'HISTORICAL COMPARISON')}

<div class="grid trend-grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)"><div class="panel"><div class="panel-head"><div><h2>${state.trendTier} by Act</h2><p class="small">${subset[0]} → ${subset[subset.length-1]} · ${state.trendEstimate?'Estimated concept':'Observed concept'}</p></div><div class="segmented">${switches}</div></div>${series.length?chart(series,subset,{min:0,height:290,style:state.trendMode}):'<div class="empty">Select a country to draw the comparison.</div>'}<p class="inline-note" style="margin-top:12px">Each point represents an illustrative Act observation. Missing Acts are displayed as gaps. Smoothed lines are visual interpolation only.</p></div><div class="panel"><div class="panel-head"><h2>Read the evidence</h2>${tag('NEW · CLARITY','gold')}</div><div class="stack"><div class="item-row"><div><strong>${subset.length} Acts</strong><span class="tiny">Selected inclusive range</span></div><span>◷</span></div><div class="item-row"><div><strong>${set.length} countries</strong><span class="tiny">Comparable series</span></div><span>◎</span></div><div class="item-row"><div><strong>${state.trendMode==='standard'?'Straight':state.trendMode==='smooth'?'Curved':'Stepped'} chart</strong><span class="tiny">Explicit gaps in evidence</span></div><span>⌁</span></div><div class="callout teal"><span>ⓘ</span><p>Earlier tier values may be reconstructed from RR under a versioned policy. Archived and current cohorts can have different source coverage.</p></div></div></div></div>
${panel('Act comparison table',`${tbl(['Country',{t:'From',right:true},{t:'To',right:true},{t:'Change',right:true},{t:'Change %',right:true},{t:'Peak',right:true},{t:'Observed Acts',right:true}],rows)}<p class="inline-note" style="margin-top:12px">N/A means the comparison cannot be computed from valid endpoints. Do not treat a missing observation as zero.</p>`,`<div class="row">${btn('Export table CSV ↧','export-trends','ghost sm')}${tag('TRACEABLE SERIES','')}</div>`)}${panel('More ways to investigate',`<div class="grid g3"><div class="stack"><strong>Explain the change <span class="new-feature">PROPOSED</span></strong><p class="small">Break changes into retained, newly observed and no-longer-observed players rather than treating them as simple growth.</p></div><div class="stack"><strong>Cohort retention <span class="new-feature">PROPOSED</span></strong><p class="small">Track how much of a starting cohort remains visible in later Acts without claiming confirmed churn.</p></div><div class="stack"><strong>Threshold policy timeline <span class="new-feature">PROPOSED</span></strong><p class="small">Show the specific act-effective rank model and whether counts were reported, rebuilt or backcast.</p></div></div>`)}`}

function compare(){let playerMode=state.compareMode==='player',A=playerMode?playerById(state.compareA):countryByName(state.compareA),B=playerMode?playerById(state.compareB):countryByName(state.compareB);const list=playerMode?PLAYERS:COUNTRIES;const metrics=playerMode?[['RR',A.rr,B.rr],['Demo global rank',A.rank,B.rank],['RR delta',A.delta,B.delta]]:[['Observed players',A.players,B.players],['Radiants',A.radiants,B.radiants],['Immortal 3',A.imm3,B.imm3],['Illustrative coverage',A.coverage,B.coverage]];const bars=metrics.map(([name,a,b])=>`<tr><td>${esc(name)}</td><td class="num">${n(a)}</td><td class="num">${n(b)}</td><td class="num ${a>=b?'pos':'neg'}">${a===b?'Same':a>b?'A +'+n(a-b):'B +'+n(b-a)}</td></tr>`);const series=playerMode?[{name:A.name,values:A.history},{name:B.name,values:B.history}]:[{name:A.name,values:TRENDS[A.name]||TRENDS.India},{name:B.name,values:TRENDS[B.name]||TRENDS.Japan}];return `${head('Compare fairly','Place entities side by side, align the source context, and reveal which conclusions are supported.',a('Open Act Trends →','trends','ghost'),'SIDE-BY-SIDE INVESTIGATION')}

if(ac==='open-region'){state.region=el.dataset.region;state.regionTab='standings';nav('region');return}if(ac==='open-country'){state.country=el.dataset.country;state.countryTab='overview';nav('country');return}if(ac==='open-player'){state.player=el.dataset.player;nav('player');return}if(ac==='archive-tab'){state.archiveTab=el.dataset.tab;render(false);return}if(ac==='region-tab'){state.regionTab=el.dataset.tab;render(false);return}if(ac==='country-tab'){state.countryTab=el.dataset.tab;render(false);return}if(ac==='leaderboard-prev'){state.globalPage=Math.max(1,state.globalPage-1);document.getElementById('leaderboardResults').innerHTML=renderLeaderboardResults();return}if(ac==='leaderboard-next'){state.globalPage++;document.getElementById('leaderboardResults').innerHTML=renderLeaderboardResults();return}if(ac==='trend-mode'){state.trendMode=el.dataset.mode;render(false);return}if(ac==='trend-country'){const c=el.dataset.country;if(state.trendSelected.includes(c)){state.trendSelected=state.trendSelected.filter(x=>x!==c)}else if(state.trendSelected.length<6){state.trendSelected.push(c)}else{toast('Up to six countries can be compared');return}render(false);return}if(ac==='compare-mode'){state.compareMode=el.dataset.mode;state.compareA=state.compareMode==='country'?'India':'skrossi';state.compareB=state.compareMode==='country'?'Japan':'pegasus';render(false);return}
if(ac==='toggle-save'){saveToggle(el.dataset.key);return}if(ac==='save-compare'){saveToggle(compareKey());return}if(ac==='toggle-estimate'){state.viewMode=state.viewMode==='observed'?'estimated':'observed';toast(state.viewMode==='estimated'?'Demo estimate view selected: no model calculations are connected':'Observed-only demo restored');render(false);return}if(ac==='watch-open'){const [type,id]=el.dataset.key.split(':');if(type==='player')state.player=id;if(type==='country')state.country=id;if(type==='region')state.region=id;if(type==='compare'){const [m,a,b]=id.split('|');state.compareMode=m;state.compareA=a;state.compareB=b;}nav(type==='compare'?'compare':type==='player'?'player':type==='country'?'country':'region');return}if(ac==='clear-watch'){state.watch=[];store.set('watch',[]);toast('Saved subjects cleared in this browser');render(false);return}if(ac==='demo-auth'){toast('Authentication is not connected. Opening the local watchlist preview.');nav('watchlist');return}
if(ac==='export-csv'){const list=filteredPlayers();csvDownload('ranked-observatory-demo-players.csv',[['Global rank','Player','Riot tag','Region','Country','Tier','RR','Change'],...list.map(p=>[p.rank,p.name,p.tag,p.region,p.country,p.tier,p.rr,p.delta])]);toast('Sample ranking CSV generated locally');return}if(ac==='export-trends'){const subset=ACTS.slice(state.trendFrom,state.trendTo+1);csvDownload('ranked-observatory-demo-trends.csv',[['Country',...subset],...state.trendSelected.map(c=>[c,...trendValues(c).map(v=>v===null?'':v)])]);toast('Sample Act trend CSV generated locally');return}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='searchInput'){results(el.value);return}if(el.dataset.input==='leaderboard-search'){state.globalSearch=el.value;state.globalPage=1;document.getElementById('leaderboardResults').innerHTML=renderLeaderboardResults();return}if(el.dataset.input==='country-search'){state.countrySearch=el.value;document.getElementById('countryResults').innerHTML=tbl(['Country',{t:'Players',right:true},{t:'Radiants',right:true},{t:'Immortal 3',right:true},{t:'Coverage',right:true},{t:'Δ',right:true}],countryRows(COUNTRIES.filter(c=>c.name.toLowerCase().includes(state.countrySearch.toLowerCase())),{coverage:true}));return}});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.input;if(el.id==='globalAct'){state.act=el.value;toast('Act selection updated. No historical backend is connected in this design preview.');render(false);return}if(k==='leaderboard-region'){state.globalRegion=el.value;state.globalPage=1;document.getElementById('leaderboardResults').innerHTML=renderLeaderboardResults()}if(k==='leaderboard-tier'){state.globalTier=el.value;state.globalPage=1;document.getElementById('leaderboardResults').innerHTML=renderLeaderboardResults()}if(k==='leaderboard-sort'){state.globalSort=el.value;state.globalPage=1;document.getElementById('leaderboardResults').innerHTML=renderLeaderboardResults()}if(k==='subregion'){state.subregion=el.value;render(false)}if(k==='period'){state.period=el.value;render(false)}if(k==='trend-from'){const v=Number(el.value);state.trendFrom=Math.min(v,state.trendTo);render(false)}if(k==='trend-to'){const v=Number(el.value);state.trendTo=Math.max(v,state.trendFrom);render(false)}if(k==='trend-tier'){state.trendTier=el.value;render(false)}if(k==='trend-estimate'){state.trendEstimate=el.checked;render(false)}if(k==='compare-a'){state.compareA=el.value;render(false)}if(k==='compare-b'){state.compareB=el.value;render(false)}if(k==='pref-compact'){state.prefs.compact=el.checked;render(false)}if(k==='pref-reduced'){state.prefs.reduced=el.checked;render(false)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'||(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))){e.preventDefault();modal(true)}if(e.key==='Escape'){if(document.getElementById('searchModal').classList.contains('show')){modal(false)}else if(state.mobileMore)mobileMore()}});
document.getElementById('searchModal').addEventListener('click',e=>{if(e.target.id==='searchModal')modal(false)});window.addEventListener('popstate',()=>{state.page=location.hash.replace('#/','')||'overview';render()});window.addEventListener('hashchange',()=>{const p=location.hash.replace('#/','')||'overview';if(p!==state.page){state.page=p;render()}});state.page=location.hash.replace('#/','')||'overview';render();
</script>
</body>
</html>
